<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Cropper</title>
    <style>
      /* Splash screen: static markup shows instantly while the script bundle
         loads; the app removes it once React has mounted. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        color: #fcfcfc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 1.1rem;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
      }
      /* Title colored with the logo's gradient. */
      .splash-title {
        font-size: 22px;
        line-height: 1;
        font-weight: 600;
        background: linear-gradient(120deg, #28a9e5, #32b2ec 55%, #9a7ce4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      /* Spinner in the logo's blue-violet palette. */
      .splash-spinner {
        width: 22px;
        height: 22px;
        margin-top: 0.2rem;
        border: 3px solid rgba(155, 70, 218, 0.18);
        border-top-color: #28a9e5;
        border-right-color: #32b2ec;
        border-bottom-color: #9a7ce4;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: light) {
        #splash {
          background: #eff0f1;
          color: #232629;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <div class="splash-brand">
        <img class="splash-logo" src="icon.svg" alt="" />
        <div class="splash-title">Video Cropper</div>
      </div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
