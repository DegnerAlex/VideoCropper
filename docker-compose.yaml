services:
  frontend:
    working_dir: /srv/
    restart: "no"
    build:
      context: ./
      dockerfile: docker/frontend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        USER: ${USER:-developer}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./videocropper/:/srv:cached
    ports:
      - "1420:1420"
    command: sh -c "npm run dev"
    network_mode: host

  videocropper:
    restart: "no"
    build:
      context: ./
      dockerfile: docker/videocropper/Dockerfile
    environment:
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - RUST_BACKTRACE=full
      - DISPLAY=${DISPLAY}
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
      - WEBKIT_DEBUG=1
      - CI=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # linuxdeploy (AppImage bundler) is itself an AppImage and cannot mount
      # squashfs inside the container without FUSE.
      - APPIMAGE_EXTRACT_AND_RUN=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./videocropper:/srv:cached
      - ~/.local/share/:/root/.local/share/
      - /home/sensey/:/home/sensey/
      # Persistent cargo registry: gen/android references crates by absolute
      # registry paths, which must survive across `docker compose run` sessions.
      - cargo-registry:/root/.cargo/registry
    devices:
      - /dev/fuse:/dev/fuse

    working_dir: /srv
    command: cargo tauri dev
    network_mode: host
    stdin_open: true
    tty: true
    depends_on:
      - frontend

# Persisted cargo registry shared by exergame containers
volumes:
  cargo-registry:
